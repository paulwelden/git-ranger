[package]
name = "git-ranger"
version = "0.1.7"
edition = "2021"
authors = ["Paul Welden"]
description = "A command line tool that manages and synchronizes local Git repositories across multiple providers"
license = "MIT"

[lib]
name = "git_ranger"
path = "src/lib.rs"

[[bin]]
name = "git-ranger"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
urlencoding = "2.1"
indicatif = "0.17"
dirs = "5"

[dev-dependencies]
assert_fs = "1.0"
serial_test = "3.0"
